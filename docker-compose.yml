services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ttc_reliability
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: ttc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttc -d ttc_reliability"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
